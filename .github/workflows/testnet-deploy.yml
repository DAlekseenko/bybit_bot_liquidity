name: Testnet read-only deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/dalekseenko/bybit_bot_liquidity

concurrency:
  group: testnet-server-deploy
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/master' && needs.publish.outputs.digest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: testnet-server
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Validate gate and prepare pinned SSH
        env:
          REVIEWERS_CONFIRMED: ${{ vars.REQUIRED_REVIEWERS_CONFIRMED }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$REVIEWERS_CONFIRMED" == true && -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" && -n "$DEPLOY_PATH" ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.:-]+$ && "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ && "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ && "$DEPLOY_PATH" != / && "$DEPLOY_PATH" != *..* ]]
          known_host_lookup="$DEPLOY_HOST"
          [[ "$DEPLOY_PORT" == 22 ]] || known_host_lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"
          install -d -m 700 "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy-ssh/id"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id" "$RUNNER_TEMP/deploy-ssh/known_hosts"
          ssh-keygen -F "$known_host_lookup" -f "$RUNNER_TEMP/deploy-ssh/known_hosts" >/dev/null
          printf 'Host testnet-server\n HostName %s\n User %s\n Port %s\n IdentityFile %s/id\n UserKnownHostsFile %s/known_hosts\n StrictHostKeyChecking yes\n IdentitiesOnly yes\n BatchMode yes\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "${DEPLOY_PORT:-22}" "$RUNNER_TEMP/deploy-ssh" "$RUNNER_TEMP/deploy-ssh" > "$RUNNER_TEMP/deploy-ssh/config"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/config"
          echo "SSH_CONFIG=$RUNNER_TEMP/deploy-ssh/config" >> "$GITHUB_ENV"
          echo "DEPLOY_PATH=$DEPLOY_PATH" >> "$GITHUB_ENV"
        shell: bash
      - name: Copy release inputs
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          scp -F "$SSH_CONFIG" ops/docker-compose.release.yml configs/config.yaml "testnet-server:$DEPLOY_PATH/"
        shell: bash
      - name: Deploy immutable image
        env:
          SSH_CONFIG: ${{ runner.temp }}/deploy-ssh/config
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: bash ops/deploy-testnet.sh
        shell: bash
      - if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-ssh"
        shell: bash
