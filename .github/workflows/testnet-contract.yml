name: Testnet contract tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testnet-contract
    env:
      BYBIT_TESTNET_CONTRACT_TESTS: "1"
      BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
      BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run public and optional signed read-only contract tests
        run: go test -tags=integration ./internal/exchange/bybit
