name: bybit-liquidity-bot

services:
  bot:
    image: ${IMAGE_REF:?Set IMAGE_REF to the published GHCR digest}
    restart: unless-stopped
    init: true
    user: ${BOT_UID:-1000}:${BOT_GID:-1000}
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - -config
      - /app/configs/config.yaml
      - -metrics-address
      - 127.0.0.1:8080
    environment:
      BYBIT_API_KEY: ${BYBIT_API_KEY:-}
      BYBIT_API_SECRET: ${BYBIT_API_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:-}
      SSL_CERT_DIR: /etc/ssl/certs:/app/certs
    volumes:
      - ${DEPLOY_PATH:?Set DEPLOY_PATH}/config.yaml:/app/configs/config.yaml:ro
      - ${DEPLOY_PATH}/certs:/app/certs:ro
      - ${BOT_DATA_DIR:?Set BOT_DATA_DIR}:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "/app/bot", "-config", "/app/configs/config.yaml", "-check-storage"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
