services:
  bot:
    command:
      - -config
      - /app/configs/config.yaml
      - -metrics-address
      - 127.0.0.1:8080
    volumes:
      - ${BOT_DATA_DIR:?Set BOT_DATA_DIR to an absolute host directory}:/app/data
  sqlite:
    volumes:
      - ${BOT_DATA_DIR:?Set BOT_DATA_DIR to an absolute host directory}:/data:ro
