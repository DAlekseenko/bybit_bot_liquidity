# Пример конфигурации Momentum для Testnet (CM-054). Только Testnet: Mainnet и live
# этим файлом не включаются. Ключи API — только env MOMENTUM_TESTNET_API_KEY и
# MOMENTUM_TESTNET_API_SECRET, не в этом файле.
schema_version: 1
strategy_id: momentum-v1
profile: baseline_delta_1x
profile_version: v1
model_id: roc30
mode: testnet
start_policy: next_monday
symbols:
  - BTCUSDT
  - ETHUSDT
  - HYPEUSDT
leverage: 1
margin_mode: ISOLATED_MARGIN
auto_add_margin: false
position_mode: one_way
initial_equity_usdt: "10000"
data_source:
  kind: bybit_testnet_public
  environment: testnet
testnet:
  # TODO(D-06): идентификатор выделенного Testnet-субаккаунта (isolated, one-way).
  account_id: testnet-subaccount
  # Отправка заявок закрыта; включает оператор явно после проверки параметров.
  trading_enabled: false
  # D-05: stop по умолчанию выключен; true отклоняется до решения владельца.
  stop_enabled: false
  # TODO(D-04): значения ниже — заглушки примера, не утверждены владельцем.
  max_data_age: 2m
  poll_interval: 30s
  rest_deadline: 10s
  slippage_rate: "0.005"
  margin_buffer_rate: "0.01"
  equity_tolerance_usdt: "0.01"
