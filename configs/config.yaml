# Настройки подключения к Bybit. Для MVP используется Testnet.
exchange:
  # true включает тестовую среду Bybit и защищает от торговли на реальном счете.
  # Значение false и URL вне официального Testnet отклоняются загрузчиком.
  testnet: true
  # REST API URL для получения свечей, open interest и отправки ордеров.
  base_url: https://api-testnet.bybit.com
  # WebSocket URL для публичных потоков, включая ликвидации.
  websocket_url: wss://stream-testnet.bybit.com/v5/public/linear
  # API credentials никогда не указываются в YAML. Для будущего private API
  # используются только BYBIT_API_KEY и BYBIT_API_SECRET из окружения.

# Торговый инструмент. MVP работает только с одним символом.
symbol: BTCUSDT

# Параметры генерации торгового сигнала.
strategy:
  # Изменение OI измеряется за завершённое пятиминутное окно.
  oi_window_minutes: 5
  oi_growth_percent: 0.5

  # Сравнивается закрытая свеча с предыдущими 20 закрытыми свечами.
  volume_sma_period: 20
  volume_multiplier: 2.0

  # Сумма ликвидаций одного направления за пять минут.
  liquidation_window_minutes: 5
  liquidation_threshold_usd: 100000

# Фиксированный риск на сделку и уровни выхода.
risk:
  # Для Testnet можно установить 1.0. Mainnet текущим MVP не поддерживается.
  risk_per_trade_percent: 1.0

  stop_loss_percent: 0.8
  take_profit_percent: 1.6

  # Резерв для расчёта размера позиции.
  estimated_round_trip_fee_percent: 0.11
  slippage_allowance_percent: 0.04

# Параметры paper-trade и будущего торгового исполнения.
# Реальный executor пока не подключён, поэтому секция не активирует биржевые сделки.
trading:
  dry_run: false
  # Фиксированный баланс для воспроизводимой virtual PnL аналитики.
  virtual_balance_usd: 1000
  max_open_positions: 1
  cooldown_minutes: 10
  max_trades_per_day: 10

# Хранилище сделок, сигналов и статистики.
storage:
  # Имя зарегистрированного CGo-free SQLite-драйвера.
  driver: sqlite
  # Путь к локальной SQLite базе данных.
  dsn: data/trades.db

# Настройки логирования через slog.
logging:
  # Допустимые уровни: debug, info, warn, error.
  level: debug
